services:
  - type: web
    name: smartmedwaste-backend
    runtime: docker
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
