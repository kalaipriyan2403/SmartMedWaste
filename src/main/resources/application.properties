spring.application.name=smartmedwaste-backend

# --- Database (set via environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartmedwaste}
spring.datasource.username=${DB_USER:smartmedwaste_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool: free Neon/Render tiers have limited memory and connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# --- Security ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Comma-separated list of allowed web origins (admin panel)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Render provides PORT
server.port=${PORT:8080}

# Hosted FastAPI AI service
ai.classification.service-url=${AI_URL:http://localhost:8000}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Health endpoint-friendly graceful shutdown
server.shutdown=graceful
